services:
  pcb-db:
    image: pgvector/pgvector:pg16
    container_name: pcb-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: pcb
      POSTGRES_PASSWORD: pcb_password
      POSTGRES_DB: pcbcopilot
    ports:
      - "5439:5432"
    volumes:
      - pcb_pgdata:/var/lib/postgresql/data

volumes:
  pcb_pgdata:
